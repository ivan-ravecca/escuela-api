name: PR Tests and Coverage

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  test-and-coverage:
    name: Test and Coverage
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: "5173"
      JWT_SECRET: test-jwt-secret
      JWT_EXPIRATION: 7d
      GOOGLE_CLIENT_ID: test-google-client
      ALLOWED_DOMAIN: escuelaenfermeria.com.uy
      SITE_URL: https://escuelaenfermeria.com.uy
      RESEND_API_KEY: re_test_key
      EMAIL_TO: admin@escuelaenfermeria.com.uy
      EMAIL_FROM: noreply@escuelaenfermeria.com.uy
      HASH_SECRET: test-hash-secret
      CSRF_SECRET: test-csrf-secret
      ANTHROPIC_API_KEY: test-anthropic-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          if-no-files-found: warn
